name: Leads Build (PR)

on:
  pull_request:
    branches:
      - otter
    paths-ignore:
      - "**.md"

env:
  CGO_ENABLED: 0
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  pull-requests: read

jobs:
  build:
    runs-on: ubicloud-standard-2

    steps:
      - uses: actions/checkout@v4

      - name: Checkout CustomerOS
        uses: actions/checkout@v4
        with:
          repository: customeros/customeros
          path: ./customeros

      - name: Set up Go
        uses: ubicloud/setup-go@v5
        with:
          go-version: 1.24.2
          cache: true
        env:
          GOPROXY: "direct"
          GOSUMDB: "off"

      - name: Install dependencies
        run: |
          ./deployments/runners/install-dependencies.sh

      - name: Build Go Binary
        run: |
          ./deployments/runners/build.sh
