name: Leads Deploy

on:
  push:
    branches:
      - otter
    paths-ignore:
      - "**.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/customer-os-leads
  CGO_ENABLED: 0
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  contents: write
  pull-requests: read
  packages: write

jobs:
  deploy:
    runs-on: ubicloud-standard-2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ubicloud/setup-go@v5
        with:
          go-version: 1.24.2
          cache: true
        env:
          GOPROXY: "direct"
          GOSUMDB: "off"

      - name: Install dependencies
        run: |
          ./deployments/runners/install-dependencies.sh

      - name: Build Go binary
        run: |
          ./deployments/runners/build.sh

      - name: Check if release is required
        run: |
          ./deployments/runners/check-release-needed.sh

      - name: Generate version number
        if: env.RELEASE_NEEDED == 'true'
        id: version
        run: |
          ./deployments/runners/generate-version.sh

      - name: Create and push tag
        if: env.RELEASE_NEEDED == 'true'
        run: |
          ./deployments/runners/create-release-tag.sh

      - name: Create release
        if: env.RELEASE_NEEDED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          generate_release_notes: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: env.RELEASE_NEEDED == 'true'
        run: |
          ./deployments/runners/build-and-push-image.sh \
            ${{ env.REGISTRY }} \
            ${{ env.IMAGE_NAME }} \
            ${{ env.VERSION }} \
            "linux/arm64" \
            "arm64"
