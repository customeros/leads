name: Leads Deploy

on:
  push:
    branches:
      - otter
    paths-ignore:
      - "**.md"

env:
  APP_NAME: leads
  IMAGE_NAME: customer-os-leads
  REGISTRY: ghcr.io
  CGO_ENABLED: 0
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CLOUD_REPO: customeros/cloud

permissions:
  contents: write
  pull-requests: read
  packages: write

jobs:
  deploy:
    runs-on: ubicloud-standard-2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release is required
        run: |
          ./deployments/runners/check-release-needed.sh

      - name: Set up Go
        if: env.RELEASE_NEEDED == 'true'
        uses: ubicloud/setup-go@v5
        with:
          go-version: 1.24.2
          cache: true
        env:
          GOPROXY: "direct"
          GOSUMDB: "off"

      - name: Install dependencies
        if: env.RELEASE_NEEDED == 'true'
        run: |
          ./deployments/runners/install-dependencies.sh

      - name: Build Go binary
        if: env.RELEASE_NEEDED == 'true'
        run: |
          ./deployments/runners/build.sh

      - name: Generate version number
        if: env.RELEASE_NEEDED == 'true'
        id: version
        run: |
          ./deployments/runners/generate-version.sh

      - name: Create and push tag
        if: env.RELEASE_NEEDED == 'true'
        run: |
          ./deployments/runners/create-release-tag.sh

      - name: Create release
        if: env.RELEASE_NEEDED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          generate_release_notes: true

      - name: Login to GitHub Container Registry
        if: env.RELEASE_NEEDED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.LEADS_DEPLOY_KEY }}

      - name: Set up Docker Buildx
        if: env.RELEASE_NEEDED == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        if: env.RELEASE_NEEDED == 'true'
        run: |
          ./deployments/runners/build-and-push-image.sh \
            ${{ env.REGISTRY }} \
            ${{ env.IMAGE_NAME }} \
            ${{ env.VERSION }} \
            "linux/arm64" \
            "arm64" \
            ${{ env.APP_NAME }}

      - name: Checkout cloud repo
        if: env.RELEASE_NEEDED == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUD_REPO }}
          token: ${{ secrets.CLOUD_REPO_KEY }}
          path: cloud-repo
          fetch-depth: 1

      - name: Update cloud version
        if: env.RELEASE_NEEDED == 'true'
        run: |
          ./deployments/runners/update-cloud.sh ${{ env.APP_NAME }}
